[package]
name = "epsilon-app"
description = "Epsilon native desktop whiteboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "epsilon"
path = "src/main.rs"

[dependencies]
egui.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
# PNG export (task 6.2): deterministic CPU paths and glyph coverage, no GPU
# surface. Chosen in task 6.1 (DECISIONS.md D-052).
tiny-skia = "0.12"
fontdue = "0.9"
epsilon-core = { path = "../epsilon-core" }

[lints.rust]
unsafe_code = "forbid"
