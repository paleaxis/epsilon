[workspace]
resolver = "3"
members = ["crates/epsilon-core", "crates/epsilon-app"]
default-members = ["crates/epsilon-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/paleaxis/epsilon"

[workspace.dependencies]
egui = "0.37"
# glow (OpenGL) instead of the default wgpu backend: smaller dependency graph,
# broad Linux driver support, no shader compiler stack.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native file dialogs for save/open. Linux uses the desktop portal (no GTK/WebView).
rfd = "0.18"
# System clipboard image copy (task 6.5). `wayland-data-control` prefers the
# compositor's data-control protocol (niri supports it) over XWayland, and
# `image-data` provides `set_image`/PNG transfer.
arboard = { version = "3.7", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
